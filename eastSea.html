<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동해여행 일정</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f6f8fb; --card:#fff; --text:#1c2733; --muted:#6b7a8a; --accent:#1e78c8; --line:#dde4ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121820; --card:#1b242e; --text:#e6edf3; --muted:#8b9aab; --accent:#5aa9ee; --line:#2c3846; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px 64px; background:var(--bg); color:var(--text);
         font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  main { max-width:760px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:26px; }
  h2 { margin:0 0 12px; font-size:17px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .people { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  .person { border:1px solid var(--line); border-radius:10px; padding:12px; }
  .person b { display:block; }
  .person span { color:var(--muted); font-size:13px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 2px; }
  input, textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
                    background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height:70px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .warn { color:#b7791f; font-size:13px; margin:8px 0 0; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:6px 4px; text-align:left; border-bottom:1px solid var(--line); font-size:14px; }
  td input { padding:5px 8px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:7px 14px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .check { display:flex; gap:8px; align-items:center; padding:3px 0; }
  .check input[type=checkbox] { width:auto; }
  .check input[type=text] { border:0; background:transparent; padding:2px 4px; }
  .amt { text-align:right; }
  th.amt { text-align:right; }
  .total { font-weight:600; margin-top:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chips button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #overview { width:100%; height:380px; border-radius:10px; z-index:0; }
  #mapFrame { width:100%; height:380px; border:0; border-radius:10px; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .gallery figure { margin:0; }
  .gallery img { width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top; border:1px solid var(--line); border-radius:10px; display:block; background:var(--bg); }
  .gallery figcaption { font-size:13px; color:var(--muted); margin-top:4px; }
  .maplinks { margin:8px 0 0; font-size:13px; }
  .maplinks a { color:var(--accent); margin-right:12px; }
</style>
</head>
<body>
<main>
  <h1>🌊 동해여행</h1>
  <p class="sub">중학교 친구 3명 · 입력한 내용은 이 브라우저에 자동 저장됩니다</p>

  <section>
    <h2>멤버 / 출발지</h2>
    <div class="people">
      <div class="person"><b>나</b><span>서울 출발</span></div>
      <div class="person"><b>대기</b><span>대구 출발</span></div>
      <div class="person"><b>도미노</b><span>구미 출발</span></div>
    </div>
  </section>

  <section>
    <h2>기본 정보</h2>
    <div class="row">
      <div><label>출발일</label><input type="date" data-save="startDate"></div>
      <div><label>복귀일</label><input type="date" data-save="endDate"></div>
    </div>
    <div class="row">
      <div><label>목적지 (예: 동해시, 강릉, 속초 등)</label><input type="text" data-save="dest" placeholder="아직 미정"></div>
      <div><label>이동수단</label><input type="text" data-save="transport" placeholder="자차 / KTX / 버스 등"></div>
    </div>
    <label>만날 장소 / 시간</label>
    <input type="text" data-save="meet" placeholder="각자 이동 후 현지 집결? 중간 합류?">
    <p class="warn">⚠️ 미확인: 서울·대구·구미 → 목적지 이동 시간/요금 — 목적지와 이동수단이 정해지면 공식 자료(코레일, 고속버스 등)로 확인 필요</p>
  </section>

  <section>
    <h2>🗺️ 지도</h2>
    <div class="chips" id="chips"></div>
    <div class="row">
      <input type="text" id="mapQ" placeholder="장소 검색 (예: 묵호등대, 추암 촛대바위)">
      <div><button id="mapGo">검색</button></div>
    </div>
    <p></p>
    <div id="overview"></div>
    <iframe id="mapFrame" hidden loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="지도"></iframe>
    <p class="maplinks"><a id="openMap" target="_blank" rel="noopener">구글맵에서 열기</a><a id="openRoute" target="_blank" rel="noopener">동해역 → 숙소 길찾기</a></p>
  </section>

  <section>
    <h2>출발지별 이동 계획</h2>
    <table>
      <tr><th>이름</th><th>출발지</th><th>출발 시각</th><th>이동 방법 / 메모</th></tr>
      <tr><td>나</td><td>서울</td><td><input type="time" data-save="t_me"></td><td><input type="text" data-save="m_me"></td></tr>
      <tr><td>대기</td><td>대구</td><td><input type="time" data-save="t_dg"></td><td><input type="text" data-save="m_dg"></td></tr>
      <tr><td>도미노</td><td>구미</td><td><input type="time" data-save="t_dm"></td><td><input type="text" data-save="m_dm"></td></tr>
    </table>
  </section>

  <section>
    <h2>일정</h2>
    <table id="schedule"></table>
  </section>

  <section>
    <h2>숙소 / 맛집 / 가고 싶은 곳</h2>
    <label>숙소</label><textarea data-save="stay"></textarea>
    <label>먹을 곳</label><textarea data-save="food"></textarea>
    <label>가볼 곳</label><textarea data-save="spots"></textarea>
  </section>

  <section>
    <h2>비용</h2>
    <table id="budget"></table>
    <div class="total" id="total"></div>
  </section>

  <section>
    <h2>📎 갤러리 (승차권 · 예약)</h2>
    <div class="gallery">
      <figure><a href="images/eastSea/KakaoTalk_Photo_2026-11-07-14-44-10.jpeg" target="_blank" rel="noopener"><img src="images/eastSea/KakaoTalk_Photo_2026-11-07-14-44-10.jpeg" loading="lazy" alt="서울 → 동해 KTX (12/31 10:59 → 13:36)"></a><figcaption>서울 → 동해 KTX (12/31 10:59 → 13:36)</figcaption></figure>
      <figure><a href="images/eastSea/KakaoTalk_Photo_2026-11-07-14-42-26%20003.jpeg" target="_blank" rel="noopener"><img src="images/eastSea/KakaoTalk_Photo_2026-11-07-14-42-26%20003.jpeg" loading="lazy" alt="동대구 → 포항 → 동해 승차권 목록"></a><figcaption>동대구 → 포항 → 동해 승차권 목록</figcaption></figure>
      <figure><a href="images/eastSea/KakaoTalk_Photo_2026-11-07-14-42-26%20002.png" target="_blank" rel="noopener"><img src="images/eastSea/KakaoTalk_Photo_2026-11-07-14-42-26%20002.png" loading="lazy" alt="영수증 · 동대구 10:20 → 포항 10:55"></a><figcaption>영수증 · 동대구 10:20 → 포항 10:55</figcaption></figure>
      <figure><a href="images/eastSea/KakaoTalk_Photo_2026-11-07-14-42-26%20001.png" target="_blank" rel="noopener"><img src="images/eastSea/KakaoTalk_Photo_2026-11-07-14-42-26%20001.png" loading="lazy" alt="영수증 · 포항 11:43 → 동해 14:15"></a><figcaption>영수증 · 포항 11:43 → 동해 14:15</figcaption></figure>
      <figure><a href="images/eastSea/KakaoTalk_Photo_2026-11-07-14-44-52.jpeg" target="_blank" rel="noopener"><img src="images/eastSea/KakaoTalk_Photo_2026-11-07-14-44-52.jpeg" loading="lazy" alt="현진관광호텔 예약 확인서"></a><figcaption>현진관광호텔 예약 확인서</figcaption></figure>
    </div>
  </section>

  <p><button class="ghost" id="reset">전체 초기화</button></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const KEY = 'eastSea.v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
state.startDate ??= '2026-12-31';
state.transport ??= '각자 대중교통';
state.dest ??= '동해';
state.meet ??= '동해역';
state.t_me ??= '10:59';
state.m_me ??= 'KTX 서울역 → 동해역';
state.t_dg ??= '10:20';
state.m_dg ??= '기차 동대구 10:20 → 포항 10:55 / 포항 11:43 → 동해 14:15 (승차권 2매, 포항 환승 48분)';
state.t_dm ??= '10:20';
state.m_dm ??= '기차 동대구 10:20 → 포항 10:55 / 포항 11:43 → 동해 14:15 (승차권 2매). ⚠️ 구미 → 동대구 이동 미확인';
state.endDate ??= '2027-01-01';
state.stay ??= '현진관광호텔 디럭스 트윈 · 2026년 12월 31일 ~ 2027년 1월 1일 (1박) · 체크인 15:00 / 체크아웃 11:00 · 기준 2명 / 최대 4명 · 차량방문';
state.schedule ??= [
  { t:'2026년 12월 31일 14:15', what:'동해역 도착 (기차)' },
  { t:'2026년 12월 31일 15:00', what:'현진관광호텔 체크인' },
  { t:'2027년 1월 1일 11:00', what:'현진관광호텔 체크아웃' },
  { t:'2027년 1월 1일', what:'울진 덕구온천 (시간 미정)' }
];
state.costs ??= [
  { n:'숙박 (현진관광호텔 1박)', amt:'230000' },
  { n:'식비 (저녁)', amt:'' },
  { n:'식비 (아침/점심)', amt:'' },
  { n:'술/안주', amt:'' },
  { n:'간식/카페', amt:'' },
  { n:'현지 교통 (택시/버스)', amt:'' },
  { n:'입장료/체험', amt:'' },
  { n:'기타', amt:'' }
];

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

// simple fields
document.querySelectorAll('[data-save]').forEach(el => {
  el.value = state[el.dataset.save] || '';
  el.addEventListener('input', () => { state[el.dataset.save] = el.value; save(); });
});

function renderSchedule() {
  const t = document.getElementById('schedule');
  t.innerHTML = '<tr><th style="width:42%">날짜/시간</th><th>내용</th><th></th></tr>';
  state.schedule.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input type="text" value="${esc(r.t)}" placeholder="1일차 10:00"></td>
      <td><input type="text" value="${esc(r.what)}"></td><td><button class="ghost">✕</button></td>`;
    const [a, b] = tr.querySelectorAll('input');
    a.oninput = () => { r.t = a.value; save(); };
    b.oninput = () => { r.what = b.value; save(); };
    tr.querySelector('button').onclick = () => { state.schedule.splice(i, 1); save(); renderSchedule(); };
    t.appendChild(tr);
  });
}

function renderBudget() {
  const t = document.getElementById('budget');
  t.innerHTML = '<tr><th>항목</th><th class="amt" style="width:30%">금액(원)</th><th></th></tr>';
  state.costs.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input type="text" value="${esc(r.n)}" placeholder="숙소, 기름값 ..."></td>
      <td><input type="text" inputmode="numeric" class="amt" value="${fmt(r.amt)}" placeholder="0"></td><td><button class="ghost">✕</button></td>`;
    const [a, b] = tr.querySelectorAll('input');
    a.oninput = () => { r.n = a.value; save(); };
    b.oninput = () => {
      const pos = b.selectionStart, before = b.value.slice(0, pos).replace(/\D/g, '').length;
      r.amt = b.value.replace(/\D/g, ''); b.value = fmt(r.amt);
      let n = 0, np = 0;
      while (np < b.value.length && n < before) { if (/\d/.test(b.value[np])) n++; np++; }
      b.setSelectionRange(np, np);
      save(); sum();
    };
    tr.querySelector('button').onclick = () => { state.costs.splice(i, 1); save(); renderBudget(); };
    t.appendChild(tr);
  });
  sum();
}
function fmt(v) { const d = String(v ?? '').replace(/\D/g, ''); return d ? Number(d).toLocaleString('en-US') : ''; }
function sum() {
  const s = state.costs.reduce((a, r) => a + (Number(r.amt) || 0), 0);
  document.getElementById('total').textContent =
    `합계 ${s.toLocaleString()}원`;
}

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

document.getElementById('reset').onclick = () => {
  if (confirm('모든 입력을 지울까요?')) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); }
};

// map (Google Maps embed, no API key)
const PLACES = [
  { n:'동해역', q:'동해역' },
  { n:'현진관광호텔', q:'현진관광호텔 동해' },
  { n:'묵호항', q:'묵호항' },
  { n:'추암 촛대바위', q:'추암 촛대바위' },
  { n:'덕구온천', q:'울진 덕구온천' },
  { n:'무릉계곡', q:'무릉계곡' }
];
const STARTS = [
  { n:'나 · 서울역', ll:[37.5547, 126.9707] },
  { n:'도미노 · 구미역', ll:[36.1284, 128.3312] },
  { n:'대기 · 동대구역', ll:[35.8798, 128.6283] }
];
let ov;
function showOverview() {
  document.getElementById('mapFrame').hidden = true;
  document.getElementById('overview').hidden = false;
  document.getElementById('openMap').href = 'https://www.google.com/maps/dir/' +
    STARTS.map(p => p.ll.join(',')).join('/');
  document.getElementById('openMap').textContent = '구글맵에서 세 역 보기';
  document.querySelectorAll('#chips button').forEach((b, i) => b.classList.toggle('on', i === 0));
  if (!ov && window.L) {
    ov = L.map('overview');
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18, attribution:'&copy; OpenStreetMap' }).addTo(ov);
    STARTS.forEach(p => L.marker(p.ll).addTo(ov).bindTooltip(p.n, { permanent:true, direction:'right' }));
  }
  if (ov) { ov.invalidateSize(); ov.fitBounds(STARTS.map(p => p.ll), { padding:[40, 40] }); }
}
function showMap(q, idx) {
  document.getElementById('overview').hidden = true;
  document.getElementById('mapFrame').hidden = false;
  document.getElementById('openMap').textContent = '구글맵에서 열기';
  const enc = encodeURIComponent(q);
  document.getElementById('mapFrame').src = `https://www.google.com/maps?q=${enc}&hl=ko&z=14&output=embed`;
  document.getElementById('openMap').href = `https://www.google.com/maps/search/?api=1&query=${enc}`;
  document.querySelectorAll('#chips button').forEach((b, i) => b.classList.toggle('on', i === idx));
}
const c0 = document.createElement('button');
c0.className = 'ghost'; c0.textContent = '출발지 전체'; c0.onclick = showOverview;
document.getElementById('chips').appendChild(c0);
PLACES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'ghost'; b.textContent = p.n; b.onclick = () => showMap(p.q, i + 1);
  document.getElementById('chips').appendChild(b);
});
document.getElementById('openRoute').href =
  'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent('동해역') +
  '&destination=' + encodeURIComponent('현진관광호텔 동해') + '&travelmode=transit';
const goSearch = () => { const q = document.getElementById('mapQ').value.trim(); if (q) showMap('동해 ' + q, -1); };
document.getElementById('mapGo').onclick = goSearch;
document.getElementById('mapQ').onkeydown = e => { if (e.key === 'Enter') goSearch(); };
showOverview();

renderSchedule(); renderBudget();
</script>
</body>
</html>
